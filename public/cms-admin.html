<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ALET India | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#08091b;--panel:#11132d;--line:rgba(255,255,255,.12);--muted:#9fa1b5;--cyan:#68e5ef;--lime:#c9f36a;--danger:#ff9c9c;--sans:Manrope,Arial,sans-serif;--mono:"DM Mono",monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1e215c,transparent 28%),var(--ink);color:#fff;font-family:var(--sans);min-height:100vh}button,input,textarea,select{font:inherit}.shell{max-width:1280px;margin:auto;padding:28px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.07em;font-size:21px}.brand img{width:230px;height:auto;border-radius:8px;background:#fff;padding:5px 8px}.eyebrow{font:10px var(--mono);color:var(--cyan);letter-spacing:.14em}.login{width:min(440px,100%);margin:11vh auto;padding:36px;border:1px solid var(--line);border-radius:22px;background:rgba(17,19,45,.84);box-shadow:0 24px 90px rgba(0,0,0,.35)}h1{font-size:34px;line-height:1.05;letter-spacing:-.07em;margin:20px 0 10px}.muted{color:var(--muted);line-height:1.65;font-size:13px}.field{display:grid;gap:8px;margin:18px 0}.field label{font:10px var(--mono);letter-spacing:.1em;color:#c5c7d8}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;background:#0b0d22;color:#fff;outline:0}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan)}button{border:0;border-radius:9px;padding:12px 15px;cursor:pointer;font-weight:800}.primary{background:var(--cyan);color:#07101b}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.notice{min-height:19px;margin:14px 0 0;color:var(--danger);font-size:12px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:28px;border-bottom:1px solid var(--line)}.user{display:flex;align-items:center;gap:10px;font-size:12px;color:#c6c8dc}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#6b57d9;color:#fff;font-size:12px;font-weight:800}.layout{display:grid;grid-template-columns:220px 1fr;gap:28px;padding-top:28px}.side{position:sticky;top:15px;height:max-content}.side button{display:flex;width:100%;margin:3px 0;text-align:left;background:transparent;color:#bcbfd2}.side button.active,.side button:hover{background:rgba(104,229,239,.12);color:var(--cyan)}.side small{display:block;margin:27px 12px 7px;font:10px var(--mono);letter-spacing:.11em;color:#777b9c}.view{min-width:0}.view-head{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:22px}.view h2{margin:0;font-size:31px;letter-spacing:-.07em}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:26px}.card,.panel{border:1px solid var(--line);border-radius:14px;background:rgba(17,19,45,.82)}.card{padding:17px}.card span{display:block;color:#9fa1b5;font-size:11px}.card strong{display:block;font-size:32px;letter-spacing:-.08em;margin-top:8px}.panel{padding:19px}.panel h3{margin:0 0 14px;font-size:15px}.panel-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}.table th{color:#9295b1;font:10px var(--mono);letter-spacing:.08em;padding:0 10px 12px}.table td{padding:13px 10px;border-top:1px solid var(--line);vertical-align:top}.status{display:inline-block;padding:4px 7px;border-radius:999px;background:rgba(201,243,106,.15);color:var(--lime);font:10px var(--mono)}.empty{padding:26px 0;text-align:center;color:#8e92ad;font-size:12px}.content-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:15px}.content-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.content-buttons button{background:#191c41;color:#d9dbeb;text-align:left;padding:15px}.content-buttons button:hover{outline:1px solid var(--cyan);color:var(--cyan)}.form-actions{display:flex;gap:9px;align-items:center;margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.record{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.record:last-child{border:0}.record b{display:block}.record span{display:block;color:#9598b4;font-size:11px;margin-top:3px}.delete{background:transparent;color:#ffb3b3;padding:4px;font-size:11px}.role-chip{font:10px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--cyan)}@media(max-width:850px){.shell{padding:18px}.layout{grid-template-columns:1fr}.side{display:flex;gap:5px;overflow:auto;position:static}.side small{display:none}.side button{width:auto;white-space:nowrap}.cards{grid-template-columns:1fr 1fr}.panel-grid,.content-grid{grid-template-columns:1fr}.top{align-items:flex-start}.user{align-items:flex-end;flex-direction:column}.row{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}.login{margin:5vh auto;padding:24px}.view-head{display:block}.view-head button{margin-top:14px}.brand img{width:190px}}
  </style>
</head>
<body>
  <main class="shell">
    <section id="login-screen" class="login">
      <div class="brand"><img src="images/alet-india-logo.png" alt="ALET India" /></div>
      <p class="eyebrow" style="margin-top:30px">SECURE TEAM WORKSPACE</p>
      <h1>Manage the website, without the mess.</h1>
      <p class="muted">Use the email and password created in Supabase. Your access determines what you can manage.</p>
      <form id="login-form">
        <div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" required /></div>
        <div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required /></div>
        <button class="primary" type="submit" style="width:100%">Sign in to admin</button>
        <p id="login-message" class="notice"></p>
      </form>
    </section>

    <section id="app" class="hidden">
      <header class="top"><div><div class="brand"><img src="images/alet-india-logo.png" alt="ALET India" /></div><p class="eyebrow" style="margin:9px 0 0">CMS &amp; LEAD DESK</p></div><div class="user"><div><span id="user-email"></span><br /><span id="user-role" class="role-chip"></span></div><div id="initials" class="avatar">A</div><button id="signout" class="ghost">Sign out</button></div></header>
      <div class="layout">
        <nav class="side" aria-label="Admin navigation"><small>OVERVIEW</small><button class="active" data-view="dashboard">Dashboard</button><small id="crm-label">CRM</small><button id="leads-nav" data-view="leads">Lead inbox</button><small>CONTENT</small><button data-view="content">Website content</button><button data-view="projects">Projects</button><button data-view="services">Services</button><button data-view="menus">Menus &amp; submenus</button><button data-view="clients">Client logos</button><button data-view="industries">Industries</button><button data-view="testimonials">Testimonials</button><button data-view="sections">Homepage sections</button><button data-view="blogs">Blogs</button><button data-view="faqs">FAQs</button><small>GROWTH</small><button data-view="analytics">Website analytics</button><button data-view="marketing">Marketing &amp; attribution</button><small>ADMIN</small><button data-view="team">Team &amp; access</button><button data-view="system">System health</button></nav>
        <section class="view">
          <div id="dashboard-view" class="page-view"></div>
          <div id="content-view" class="page-view hidden"></div>
          <div id="projects-view" class="page-view hidden"></div>
          <div id="blogs-view" class="page-view hidden"></div>
          <div id="faqs-view" class="page-view hidden"></div>
          <div id="leads-view" class="page-view hidden"></div>
          <div id="analytics-view" class="page-view hidden"></div>
          <div id="marketing-view" class="page-view hidden"></div>
          <div id="team-view" class="page-view hidden"></div>
          <div id="system-view" class="page-view hidden"></div>
        </section>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
    const supabase = createClient('https://seegtwkfeolpjlgjlbyd.supabase.co','sb_publishable_AB_9PH5k_kHBDsXIr2IhAA_6VznqX81');
    const $ = (selector) => document.querySelector(selector);
    const tables = { projects:'projects', blogs:'blogs', faqs:'faqs', menus:'menu_items', clients:'client_logos', industries:'industries', testimonials:'testimonials', sections:'site_sections' };
    let profile = null;
    let currentContentRecords = [];
    const escapeHtml = (value='') => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const slugify = (value='') => value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    const setLoginMessage = (message='') => $('#login-message').textContent = message;
    const showApp = (on) => { $('#login-screen').classList.toggle('hidden',on); $('#app').classList.toggle('hidden',!on); };

    async function loadProfile(){
      const {data:{user}} = await supabase.auth.getUser();
      if(!user){showApp(false);return;}
      const {data,error} = await supabase.from('profiles').select('email,full_name,role,active').eq('id',user.id).single();
      if(error || !data?.active){ await supabase.auth.signOut(); setLoginMessage('Your account does not have active admin access.'); showApp(false); return; }
      profile=data; $('#user-email').textContent=data.email; $('#user-role').textContent=data.role.toUpperCase(); $('#initials').textContent=(data.full_name||data.email).slice(0,1).toUpperCase();
      const canViewLeads=['admin','sales'].includes(data.role); $('#leads-nav').classList.toggle('hidden',!canViewLeads); $('#crm-label')?.classList.toggle('hidden',!canViewLeads);
      showApp(true); await loadDashboard();
    }
    async function count(table){ const {count,error}=await supabase.from(table).select('*',{count:'exact',head:true}); return error ? '—' : count; }
    async function loadDashboard(){
      const cards = await Promise.all(['projects','blogs','faqs','leads'].map(count));
      if(!['admin','sales'].includes(profile.role)) cards[3]='Private';
      $('#dashboard-view').innerHTML=`<div class="view-head"><div><p class="eyebrow">AT A GLANCE</p><h2>Good ${new Date().getHours()<12?'morning':'afternoon'}, ${escapeHtml(profile.full_name||'team')}.</h2><p class="muted">Your website content and incoming enquiries, in one calm place.</p></div><button class="primary" data-go="content">Add website content</button></div><div class="cards"><article class="card"><span>Projects</span><strong>${cards[0]}</strong></article><article class="card"><span>Blog posts</span><strong>${cards[1]}</strong></article><article class="card"><span>FAQs</span><strong>${cards[2]}</strong></article><article class="card"><span>Leads</span><strong>${cards[3]}</strong></article></div><div class="panel-grid"><article class="panel"><h3>Getting started</h3><p class="muted">Add your real projects, services and FAQs first. Keep them as drafts until you are ready to publish them on the main website.</p><button class="ghost" data-go="content">Open content manager</button></article><article class="panel"><h3>Your access</h3><p class="muted"><b>${escapeHtml(profile.role)}</b> access is active. ${profile.role==='editor'?'You can manage website content.':profile.role==='sales'?'You can manage enquiries and follow-ups.':'You can manage content, access and CRM operations.'}</p></article></div>`;
      $('#dashboard-view [data-go="content"]')?.addEventListener('click',()=>openView('content'));
    }
    const inputValue=(record,key)=>escapeHtml(record?.[key]??'');
    const selected=(record,key,value)=>record?.[key]===value?'selected':'';
    const imageField=(record,field='cover_image_url')=>`<div class="field"><label>IMAGE</label><input type="hidden" name="existing_${field}" value="${inputValue(record,field)}" /><input name="${field}_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" /><p class="muted">Choose an image from your computer (JPG, PNG, WebP or GIF, up to 6 MB).${record?.[field]?' Current image will be kept if you do not choose a replacement.':''}</p>${record?.[field]?`<img src="${inputValue(record,field)}" alt="Current image" style="max-width:160px;max-height:90px;border-radius:8px;object-fit:cover" />`:''}</div>`;
    function legacyContentForm(type='projects',record=null){
      const editing=record?.id||''; const status=record?.status||'draft';
      const fields = type==='projects' ? `<div class="row"><div class="field"><label>PROJECT NAME</label><input name="name" required value="${inputValue(record,'name')}" /></div><div class="field"><label>TYPE</label><select name="project_type"><option value="mobile" ${selected(record,'project_type','mobile')}>Mobile app</option><option value="web" ${selected(record,'project_type','web')}>Website / platform</option><option value="game" ${selected(record,'project_type','game')}>Game</option></select></div></div><div class="field"><label>SUMMARY</label><textarea name="summary" required>${inputValue(record,'summary')}</textarea></div><div class="row"><div class="field"><label>INDUSTRY</label><input name="industry" value="${inputValue(record,'industry')}" placeholder="e.g. Logistics" /></div><div class="field"><label>PLATFORMS (comma separated)</label><input name="platforms" value="${inputValue({platforms:(record?.platforms||[]).join(', ')},'platforms')}" placeholder="Android, iOS, Web" /></div></div>${imageField(record)}<div class="row"><div class="field"><label>SHOW ON SERVICES (service slugs, comma separated)</label><input name="service_slugs" value="${inputValue({service_slugs:(record?.service_slugs||[]).join(', ')},'service_slugs')}" placeholder="web-application, mobile-app-development" /></div><div class="field"><label>SHOW ON HOMEPAGE</label><select name="featured"><option value="true" ${record?.featured?'selected':''}>Yes</option><option value="false" ${record&&!record.featured?'selected':''}>No</option></select></div></div>` : type==='blogs' ? `<div class="field"><label>TITLE</label><input name="title" required value="${inputValue(record,'title')}" /></div><div class="field"><label>CATEGORY</label><input name="category" value="${inputValue(record,'category')}" placeholder="e.g. Product strategy" /></div>${imageField(record)}<div class="field"><label>EXCERPT</label><textarea name="excerpt">${inputValue(record,'excerpt')}</textarea></div><div class="field"><label>ARTICLE CONTENT</label><textarea name="content" placeholder="Full article text">${inputValue({content:(record?.content?.body||record?.content||'')},'content')}</textarea></div>` : type==='faqs' ? `<div class="field"><label>QUESTION</label><input name="question" required value="${inputValue(record,'question')}" /></div><div class="field"><label>ANSWER</label><textarea name="answer" required>${inputValue(record,'answer')}</textarea></div><div class="field"><label>TOPIC</label><input name="topic" value="${inputValue(record,'topic')}" /></div>` : type==='menus' ? `<div class="field"><label>MENU LABEL</label><input name="label" required value="${inputValue(record,'label')}" placeholder="e.g. Our Work" /></div><div class="row"><div class="field"><label>LINK</label><input name="href" value="${inputValue(record,'href')}" placeholder="/portfolio or https://..." /></div><div class="field"><label>PARENT MENU</label><select id="menu-parent" name="parent_id"><option value="">No parent (top-level menu)</option></select></div></div><div class="row"><div class="field"><label>MENU ORDER</label><input name="sort_order" type="number" value="${inputValue(record,'sort_order')||'10'}" /></div><div class="field"><label>VISIBLE</label><select name="visible"><option value="true" ${record?.visible!==false?'selected':''}>Visible</option><option value="false" ${record?.visible===false?'selected':''}>Hidden</option></select></div></div>` : `<div class="row"><div class="field"><label>SERVICE NAME</label><input name="name" required value="${inputValue(record,'name')}" /></div><div class="field"><label>GROUP</label><select name="group_name"><option ${selected(record,'group_name','Development')}>Development</option><option ${selected(record,'group_name','Designing')}>Designing</option><option ${selected(record,'group_name','Digital Marketing')}>Digital Marketing</option></select></div></div><div class="field"><label>SUMMARY</label><textarea name="summary">${inputValue(record,'summary')}</textarea></div>${imageField(record,'hero_image_url')}`;
      const common=type==='menus'?'':`<div class="row"><div class="field"><label>URL SLUG ${type==='faqs'?'(not needed)':''}</label><input name="slug" value="${inputValue(record,'slug')}" placeholder="created automatically if blank" /></div><div class="field"><label>STATUS</label><select name="status"><option value="draft" ${status==='draft'?'selected':''}>Draft</option><option value="published" ${status==='published'?'selected':''}>Published</option></select></div></div>`;
      return `<form id="content-form"><input type="hidden" name="content_type" value="${type}" /><input type="hidden" name="record_id" value="${editing}" />${fields}${common}<div class="form-actions"><button class="primary" type="submit">${editing?'Update':'Save'} ${type==='menus'?'menu item':type.slice(0,-1)}</button>${editing?'<button class="ghost" type="button" data-cancel-edit>Cancel</button>':''}<span id="save-message" class="muted"></span></div></form>`;
    }
    async function listRecords(type){
      const table=type==='services'?'services':tables[type]; const label=type==='faqs'?'question':type==='blogs'?'title':type==='menus'?'label':type==='clients'?'client_name':type==='testimonials'?'client_name':type==='sections'?'section_key':'name';
      const select=type==='menus'?'id,label,href,parent_id,sort_order,visible,created_at':'*'; const {data,error}=await supabase.from(table).select(select).order('created_at',{ascending:false}).limit(40); currentContentRecords=data||[];
      if(error) return `<p class="notice">${escapeHtml(error.message)}</p>`; if(!data?.length) return `<p class="empty">Nothing here yet. Use the form to add the first item.</p>`;
      return data.map(row=>`<div class="record"><div><b>${escapeHtml(row[label])}</b><span>${escapeHtml(type==='menus'?(row.parent_id?'Submenu item':'Top-level menu'):(row.status||''))}</span></div><div><button class="ghost" data-edit="${row.id}">Edit</button><button class="delete" data-delete="${table}" data-id="${row.id}">Delete</button></div></div>`).join('');
    }
    async function loadMenuParents(selectedParent){ const {data}=await supabase.from('menu_items').select('id,label').is('parent_id',null).order('sort_order'); const select=$('#menu-parent'); if(!select) return; select.innerHTML='<option value="">No parent (top-level menu)</option>'+(data||[]).map(item=>`<option value="${item.id}" ${item.id===selectedParent?'selected':''}>${escapeHtml(item.label)}</option>`).join(''); }
    async function loadContent(type='projects',record=null){
      $('#content-view').innerHTML=`<div class="view-head"><div><p class="eyebrow">CONTENT MANAGER</p><h2>Keep the website current.</h2><p class="muted">Published content appears automatically on the public website. Use Homepage sections for editable headings and copy.</p></div></div><div class="content-grid"><article class="panel"><h3>${record?'Edit':'Create'} ${type==='menus'?'menu item':type.slice(0,-1)}</h3><div class="content-buttons"><button data-type="projects">Projects</button><button data-type="services">Services</button><button data-type="menus">Menus &amp; submenus</button><button data-type="clients">Client logos</button><button data-type="industries">Industries</button><button data-type="testimonials">Testimonials</button><button data-type="sections">Homepage sections</button><button data-type="blogs">Blog posts</button><button data-type="faqs">FAQs</button></div><div id="editor" style="margin-top:20px">${contentForm(type,record)}</div></article><article class="panel"><h3>Recent ${type}</h3><div id="records">Loading…</div></article></div>`;
      if(type==='menus') await loadMenuParents(record?.parent_id); $('#records').innerHTML=await listRecords(type); bindContentActions();
    }
    function bindContentActions(){
      document.querySelectorAll('[data-type]').forEach(button=>button.addEventListener('click',()=>loadContent(button.dataset.type)));
      $('#content-form')?.addEventListener('submit',saveContent); document.querySelector('[data-cancel-edit]')?.addEventListener('click',()=>loadContent($('#content-form [name="content_type"]').value));
      document.querySelectorAll('[data-edit]').forEach(button=>button.addEventListener('click',()=>{const type=$('#content-form [name="content_type"]').value; loadContent(type,currentContentRecords.find(row=>row.id===button.dataset.edit));}));
      document.querySelectorAll('[data-delete]').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('Delete this item? This cannot be undone.')) return; const {error}=await supabase.from(button.dataset.delete).delete().eq('id',button.dataset.id); if(error) alert(error.message); else loadContent($('#content-form [name="content_type"]').value);}));
    }
    async function legacySaveContent(event){
      event.preventDefault(); const form=new FormData(event.currentTarget); const type=form.get('content_type'); const table=type==='services'?'services':tables[type]; const status=form.get('status'); const split=(value)=>String(value||'').split(',').map(x=>x.trim()).filter(Boolean); const imageFieldName=type==='services'?'hero_image_url':'cover_image_url'; let imageUrl=form.get(`existing_${imageFieldName}`)||null; const file=form.get(`${imageFieldName}_file`); if(file instanceof File && file.size){if(file.size>6*1024*1024||!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){$('#save-message').textContent='Choose a JPG, PNG, WebP or GIF image smaller than 6 MB.';return;} $('#save-message').textContent='Uploading image…'; const extension=(file.name.split('.').pop()||'jpg').toLowerCase(); const path=`content/${Date.now()}-${crypto.randomUUID()}.${extension}`; const {data,error:uploadError}=await supabase.storage.from('cms-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type}); if(uploadError){$('#save-message').textContent=uploadError.message;return;} imageUrl=supabase.storage.from('cms-media').getPublicUrl(data.path).data.publicUrl;} let payload={status};
      if(type==='projects'){payload={...payload,name:form.get('name'),slug:form.get('slug')||slugify(form.get('name')),project_type:form.get('project_type'),summary:form.get('summary'),industry:form.get('industry')||null,platforms:split(form.get('platforms')),cover_image_url:imageUrl,service_slugs:split(form.get('service_slugs')),featured:form.get('featured')==='true',published_at:status==='published'?new Date().toISOString():null};}
      if(type==='services'){payload={...payload,name:form.get('name'),slug:form.get('slug')||slugify(form.get('name')),group_name:form.get('group_name'),summary:form.get('summary'),hero_image_url:imageUrl,published_at:status==='published'?new Date().toISOString():null};}
      if(type==='blogs'){payload={...payload,title:form.get('title'),slug:form.get('slug')||slugify(form.get('title')),excerpt:form.get('excerpt'),category:form.get('category')||null,cover_image_url:imageUrl,content:{body:form.get('content')||''},published_at:status==='published'?new Date().toISOString():null};}
      if(type==='faqs'){payload={...payload,question:form.get('question'),answer:form.get('answer'),topic:form.get('topic')};}
      if(type==='menus'){payload={label:form.get('label'),href:form.get('href')||null,parent_id:form.get('parent_id')||null,sort_order:Number(form.get('sort_order')||0),visible:form.get('visible')==='true'};}
      const recordId=form.get('record_id'); const request=recordId?supabase.from(table).update(payload).eq('id',recordId):supabase.from(table).insert(payload); const {error}=await request; $('#save-message').textContent=error?error.message:'Saved successfully.'; if(!error) setTimeout(()=>loadContent(type),650);
    }
    /* Homepage CMS extensions. These declarations intentionally replace the generic legacy
       handlers above while preserving Projects, Services, Blogs, FAQs and Menus. */
    function contentForm(type='projects',record=null){
      const editing=record?.id||''; const status=record?.status||'draft';

    async function saveContent(event){
      event.preventDefault(); const form=new FormData(event.currentTarget); const type=String(form.get('content_type')); const table=type==='services'?'services':tables[type]; const status=form.get('status'); const split=(value)=>String(value||'').split(',').map(x=>x.trim()).filter(Boolean); const imageFieldName=type==='services'?'hero_image_url':type==='clients'?'logo_url':(['industries','testimonials'].includes(type)?'image_url':'cover_image_url'); let imageUrl=form.get(`existing_${imageFieldName}`)||null; const file=form.get(`${imageFieldName}_file`);
      if(file instanceof File && file.size){if(file.size>6*1024*1024||!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){$('#save-message').textContent='Choose a JPG, PNG, WebP or GIF image smaller than 6 MB.';return;} $('#save-message').textContent='Uploading image…'; const extension=(file.name.split('.').pop()||'jpg').toLowerCase(); const path=`content/${Date.now()}-${crypto.randomUUID()}.${extension}`; const {data,error:uploadError}=await supabase.storage.from('cms-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type}); if(uploadError){$('#save-message').textContent=uploadError.message;return;} imageUrl=supabase.storage.from('cms-media').getPublicUrl(data.path).data.publicUrl;}
      let payload={status};
      if(type==='clients') payload={...payload,client_name:form.get('client_name'),logo_url:imageUrl,website_url:form.get('website_url')||null,sort_order:Number(form.get('sort_order')||0)};
      else if(type==='industries') payload={...payload,name:form.get('name'),image_url:imageUrl,sort_order:Number(form.get('sort_order')||0)};
      else if(type==='testimonials') payload={...payload,quote:form.get('quote'),client_name:form.get('client_name'),client_role:form.get('client_role')||null,company:form.get('company')||null,image_url:imageUrl,sort_order:Number(form.get('sort_order')||0)};
      else if(type==='sections') payload={...payload,section_key:form.get('section_key'),eyebrow:form.get('eyebrow')||null,heading:form.get('heading')||null,accent_text:form.get('accent_text')||null,intro:form.get('intro')||null,body:form.get('body')||null,sort_order:Number(form.get('sort_order')||0)};
      else if(type==='projects') payload={...payload,name:form.get('name'),slug:form.get('slug')||slugify(form.get('name')),project_type:form.get('project_type'),summary:form.get('summary'),industry:form.get('industry')||null,platforms:split(form.get('platforms')),cover_image_url:imageUrl,service_slugs:split(form.get('service_slugs')),featured:form.get('featured')==='true',published_at:status==='published'?new Date().toISOString():null};
      else if(type==='services') payload={...payload,name:form.get('name'),slug:form.get('slug')||slugify(form.get('name')),group_name:form.get('group_name'),summary:form.get('summary'),hero_image_url:imageUrl,published_at:status==='published'?new Date().toISOString():null};
      else if(type==='blogs') payload={...payload,title:form.get('title'),slug:form.get('slug')||slugify(form.get('title')),excerpt:form.get('excerpt'),category:form.get('category')||null,cover_image_url:imageUrl,content:{body:form.get('content')||''},published_at:status==='published'?new Date().toISOString():null};
      else if(type==='faqs') payload={...payload,question:form.get('question'),answer:form.get('answer'),topic:form.get('topic'),sort_order:Number(form.get('sort_order')||0)};
      else payload={label:form.get('label'),href:form.get('href')||null,parent_id:form.get('parent_id')||null,sort_order:Number(form.get('sort_order')||0),visible:form.get('visible')==='true'};
      const recordId=form.get('record_id'); const request=recordId?supabase.from(table).update(payload).eq('id',recordId):supabase.from(table).insert(payload); const {error}=await request; $('#save-message').textContent=error?error.message:'Saved successfully.'; if(!error) setTimeout(()=>loadContent(type),650);
    }

      }
    });
    $('#signout').addEventListener('click',async()=>{await supabase.auth.signOut();profile=null;showApp(false);});
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>openView(button.dataset.view)));
    supabase.auth.onAuthStateChange((_event,session)=>{if(!session){profile=null;showApp(false);}});
    loadProfile();
  </script>
</body>
</html>
